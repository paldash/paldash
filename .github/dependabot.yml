# Dependabot version updates.
#
# Minor + patch only, grouped: one PR per ecosystem per week, so the toolchain
# moves together and CI judges the set rather than twenty PRs that each pass
# alone and break in combination. MAJORS ARE NEVER PROPOSED HERE — the first
# run offered typescript 5->7, eslint 9->10, @types/node 20->26 against a
# Node 22 runtime, and a node:25 (non-LTS) base image, all at once. Those are
# peer-locked decisions taken by hand, in one commit, with the Dockerfile's
# runtime pairing in view. Security alerts and security updates are repo
# settings, independent of this file, and still cover majors.
#
# Python versions are resolved in backend/constraints.txt so updates change
# the versions installed and audited by CI.
#
# This works because GitHub is the source of truth and the Forgejo copy is
# pushed *from* the working clone (`git push backup`, one branch). Nothing
# ever pushes --mirror at GitHub, so dependabot/* branches are never pruned.
# Do not add a Forgejo -> GitHub push mirror: it would delete every
# Dependabot branch on each sync and auto-close the PRs.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    groups:
      pip-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    groups:
      actions:
        patterns: ["*"]

# Base-image version changes are coordinated manually: Docker versioning can
# classify a Python minor-version jump as an ordinary minor update. Both
# Python stages must remain on the same reviewed patch and Debian release.
# Node 22 supplies the frontend build and the runtime executable. Each update
# must pass the final-image scan, runtime startup and native-codec smoke test.
