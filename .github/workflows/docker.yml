# Build and publish the container image to GHCR.
#
# Publishes on every push to main (tag `edge`) and on version tags
# (`v1.2.3` -> `1.2.3`, `latest`). Pull requests build without pushing, so a
# broken Dockerfile fails the PR rather than the release.
#
# No secrets to configure: GITHUB_TOKEN can push to ghcr.io/<owner>/<repo>.
# The build needs nothing outside the repo — palsav/palooz are cloned from
# their own upstream inside the Dockerfile, and refs/ and refworld/ are
# excluded by .dockerignore (they hold live server passwords and real Steam
# IDs and must never enter a build context).
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=edge,enable={{is_default_branch}}

      - name: Build (and push on main/tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
