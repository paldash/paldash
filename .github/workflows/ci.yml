# One workflow, three jobs, one order: nothing publishes unless everything
# tested passes first.
#
#   backend  — Python unit tests (integration tests need palsav and a real
#              world, and run locally with refworld/ present).
#   web      — lint, unit tests, build, then the browser smoke suite and
#              Lighthouse against the built app with a real backend beside it.
#              e2e/serve.mjs boots that backend with nothing attached — no
#              world, no game server, no palsav — the shape of a fresh install.
#   image    — build the container; push to GHCR on main and on version tags.
#              Runs on pull requests too, without pushing, so a broken
#              Dockerfile fails the PR rather than the release.
#
# The reusable dependency audit gates image publication and also runs weekly.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    # `edited` so a retitled PR re-runs the title check; the heavy jobs skip
    # that event.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  security:
    uses: ./.github/workflows/audit.yml

  # Conventional Commits are enforced on the PULL REQUEST TITLE, not on a
  # contributor's individual commits: PRs are squash-merged with the title as
  # the commit subject, so the title is what reaches main's history and the
  # maintainer can edit it before merging. Nobody is blocked over the wording
  # of their work-in-progress commits.
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Through an env var, never interpolated into the script: a title is
      # attacker-controlled text.
      - run: printf '%s\n' "$PR_TITLE" | npx commitlint --verbose
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  backend:
    name: Backend tests
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Unit tests
        run: pytest -m "not integration"

  web:
    name: Web — lint, unit, build, e2e, Lighthouse
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      # The e2e backend. Runtime dependencies only: no palsav, which is the
      # point — the dashboard must boot and render without it.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r backend/requirements.txt

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # The build must not require real secrets.
          PANEL_PASSWORD: ci-build-placeholder

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npx playwright test
        env:
          E2E_PYTHON: python

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Same launcher as the smoke tests, so Lighthouse measures the app the
      # tests just exercised. Thresholds live in lighthouserc.json.
      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
        env:
          E2E_PYTHON: python

  image:
    name: Container image
    needs: [backend, web, security]
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A containerd store preserves SBOM/provenance while loading the image
      # for scanning. Publish these same bytes only after the scan succeeds.
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70
        with:
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=edge,enable={{is_default_branch}}
            # Pull requests build without pushing; naming the image anyway
            # keeps the action from warning that no tag was generated.
            type=ref,event=pr

      # No secrets to configure: GITHUB_TOKEN can push to ghcr.io/<owner>/<repo>.
      # The build needs nothing outside the repo — palsav/palooz are cloned
      # from their own upstream inside the Dockerfile, and refs/ and refworld/
      # are excluded by .dockerignore (live server passwords and real Steam
      # IDs must never enter a build context).
      - name: Build the image to scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: |
            paldash-ci:${{ github.sha }}
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Smoke-test the shipped runtime and native codec
        env:
          IMAGE: paldash-ci:${{ github.sha }}
        run: |
          docker run --rm --network none --entrypoint python3 "$IMAGE" /app/scripts/smoke-native.py
          docker run --rm --network none --entrypoint python3 "$IMAGE" -c 'import sys; assert sys.version_info[:2] == (3, 11)'
          cleanup() { docker logs paldash-smoke; docker rm -f paldash-smoke; }
          trap cleanup EXIT
          docker run --detach --name paldash-smoke --network none \
            -e HOSTNAME=127.0.0.1 -e PANEL_PASSWORD=ci-smoke-only-password \
            -e BACKUP_DIR=/app/backups -e SAVE_BASE_DIR=/tmp/no-world \
            -e PALWORLD_REST_URL=http://127.0.0.1:9 \
            -e FETCH_ASSETS_ON_BOOT=false -e DATA_REFRESH_ON_BOOT=off \
            -e PARSE_AUTO=false -e METRICS_ENABLED=false "$IMAGE"
          for attempt in {1..60}; do
            if docker exec paldash-smoke node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Scan final OS and library packages
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          version: v0.74.0
          image-ref: paldash-ci:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: json
          output: container-vulnerabilities.json
          timeout: 10m

      - name: Container vulnerability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-vulnerabilities
          path: container-vulnerabilities.json
          retention-days: 14

      - name: Publish the scanned image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            test -z "$tag" || docker push "$tag"
          done <<< "$IMAGE_TAGS"
