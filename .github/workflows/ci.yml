name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      # Integration tests are deselected: they need `palsav` (a compiled Oodle
      # extension) and a real world save, neither of which belongs in CI. They
      # run locally via `pytest` with refworld/ present.
      - name: Unit tests
        run: pytest -m "not integration"

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # The build must not require real secrets.
          PANEL_PASSWORD: ci-build-placeholder
