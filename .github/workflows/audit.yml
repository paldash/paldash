# Dependency scanning (docs/AUDIT.md S11).
#
# Runs on every PR, and weekly — a vulnerability published
# on a Tuesday should not wait for the next code change to surface. High
# severity and above fails the job; moderate noise stays out of PRs so the
# signal keeps meaning something.
#
# `pip-audit` sees only what requirements.txt names: palsav/palooz are built
# from a git checkout (not PyPI) and are outside every advisory database
# anyway. That is a known hole, not an oversight.
name: Dependency audit

on:
  workflow_call:
  pull_request:
    # Required checks must also be emitted for code-only changes. A path
    # filter would leave those PRs waiting forever for the required audits.
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      # Build and CI dependencies are part of the supply chain too.
      - run: npm audit --audit-level=high

  pip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt
      - run: pip-audit -r backend/requirements-dev.txt
