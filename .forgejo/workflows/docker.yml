# The Forgejo twin of .github/workflows/docker.yml — the backup remote can
# publish the image too, so GHCR keeps getting built even if the GitHub side
# is down or the org moves.
#
# Two deliberate differences from the GitHub copy:
#
#   - The image name is HARDCODED. `github.repository` resolves to this
#     Forgejo repo's own path (nirb/palworld-dashboard), which is not where
#     the image lives; the published name is the project's, not the mirror's.
#   - Credentials are secrets, not the ambient token. Forgejo's token has no
#     authority over ghcr.io — register two repository secrets:
#         GHCR_USERNAME  your GitHub username
#         GHCR_TOKEN     a GitHub PAT with the `write:packages` scope
#     With no secrets configured the login step fails and nothing pushes,
#     which is the honest failure for an unconfigured mirror.
#
# Needs a Forgejo Actions runner with Docker available. Without one this
# file is inert. Both CIs pushing the same commit produce equivalent images,
# so a race between them overwrites like with like.
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  image:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/paldash/paldash
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=edge,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
